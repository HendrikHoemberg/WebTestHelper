<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="befundfilter" class="befund-filter-panel">
    <h2 style="font-size: 1.05rem; font-weight: 700; color: var(--text-main); margin-top: 0; margin-bottom: 1rem; border-bottom: 1px solid var(--border-subtle); padding-bottom: 0.5rem;" th:text="#{ui.befunde.filter.titel}">Filter</h2>
    <form th:action="@{/websites/{id}/befunde(id=${site.siteId})}" method="get"
          th:attr="data-hx-get=@{/websites/{id}/befunde(id=${site.siteId})}"
          data-hx-target="#befunde-liste-container"
          data-hx-swap="innerHTML"
          data-hx-push-url="true"
          data-hx-trigger="change"
          class="filter-form">
        
        <!-- Schweregrad -->
        <fieldset class="filter-gruppe" style="border: none; padding: 0; margin-bottom: 1.25rem;">
            <legend style="font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); margin-bottom: 0.5rem;" th:text="#{ui.befunde.filter.schweregrad}">Schweregrad</legend>
            <div class="chip-gruppe" style="display: flex; flex-wrap: wrap; gap: 0.35rem;">
                <label th:each="sev : ${allSeverities}" class="filter-chip" th:classappend="${filter.severities.contains(sev)} ? 'aktiv' : ''">
                    <input type="checkbox" name="severities" th:value="${sev}" th:checked="${filter.severities.contains(sev)}" style="position: absolute; opacity: 0; width: 0; height: 0;">
                    <span th:text="#{${'ui.severity.' + sev}}">Fehler</span>
                </label>
            </div>
        </fieldset>

        <!-- Bewertungsstatus -->
        <fieldset class="filter-gruppe" style="border: none; padding: 0; margin-bottom: 1.25rem;">
            <legend style="font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); margin-bottom: 0.5rem;" th:text="#{ui.befunde.filter.bewertung}">Bewertung</legend>
            <div class="chip-gruppe" style="display: flex; flex-wrap: wrap; gap: 0.35rem;">
                <label th:each="ts : ${allTriageStatuses}" class="filter-chip" th:classappend="${filter.triageStatuses.contains(ts)} ? 'aktiv' : ''">
                    <input type="checkbox" name="triageStatuses" th:value="${ts}" th:checked="${filter.triageStatuses.contains(ts)}" style="position: absolute; opacity: 0; width: 0; height: 0;">
                    <span th:text="#{${'ui.triagestatus.' + ts}}">Ungeprüft</span>
                </label>
            </div>
        </fieldset>

        <!-- Beobachtungsstatus -->
        <fieldset class="filter-gruppe" style="border: none; padding: 0; margin-bottom: 1.25rem;">
            <legend style="font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); margin-bottom: 0.5rem;" th:text="#{ui.befunde.filter.beobachtung}">Status</legend>
            <div class="chip-gruppe" style="display: flex; flex-wrap: wrap; gap: 0.35rem;">
                <label class="filter-chip" th:classappend="${filter.observed == null} ? 'aktiv' : ''">
                    <input type="radio" name="observed" value="" th:checked="${filter.observed == null}" style="position: absolute; opacity: 0; width: 0; height: 0;">
                    <span th:text="#{ui.befunde.filter.alle_beobachtungen}">Alle Status</span>
                </label>
                <label th:each="obs : ${allObservedStatuses}" class="filter-chip" th:classappend="${filter.observed == obs} ? 'aktiv' : ''">
                    <input type="radio" name="observed" th:value="${obs}" th:checked="${filter.observed == obs}" style="position: absolute; opacity: 0; width: 0; height: 0;">
                    <span th:text="#{${'ui.observedstatus.' + obs}}">Aktiv</span>
                </label>
            </div>
        </fieldset>

        <!-- Prüfungsarten -->
        <fieldset class="filter-gruppe" style="border: none; padding: 0; margin-bottom: 1.25rem;">
            <legend style="font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); margin-bottom: 0.5rem;" th:text="#{ui.befunde.filter.pruefungen}">Prüfungsarten</legend>
            <div class="chip-gruppe" style="display: flex; flex-wrap: wrap; gap: 0.35rem;">
                <label th:each="check : ${allCheckDescriptors}" class="filter-chip" th:classappend="${filter.checkTypes.contains(check.type)} ? 'aktiv' : ''">
                    <input type="checkbox" name="checkTypes" th:value="${check.type}" th:checked="${filter.checkTypes.contains(check.type)}" style="position: absolute; opacity: 0; width: 0; height: 0;">
                    <span th:text="#{${check.titleKey}}">Tote Links</span>
                </label>
            </div>
        </fieldset>

        <div class="filter-aktionen" style="padding-top: 1rem; border-top: 1px solid var(--border-subtle);">
            <a th:href="@{/websites/{id}/befunde(id=${site.siteId})}"
               th:attr="data-hx-get=@{/websites/{id}/befunde(id=${site.siteId})}"
               data-hx-target="#befunde-liste-container"
               data-hx-swap="innerHTML"
               data-hx-push-url="true"
               class="btn-ui btn-ui-secondary btn-ui-sm button sekundär klein" style="width: 100%;" th:text="#{ui.befunde.filter.zuruecksetzen}">Filter zurücksetzen</a>
        </div>
    </form>
</div>
</body>
</html>
