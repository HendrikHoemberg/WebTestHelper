<!DOCTYPE html>
<html th:replace="~{layout :: seite(#{ui.titel.uebersicht}, ~{::main})}" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title th:text="#{ui.titel.uebersicht}">Übersicht</title>
</head>
<body>
<main>
    <!-- Page Context Header -->
    <header class="page-header-bar seiten-kopf">
        <div>
            <div class="breadcrumbs-trail">
                <a th:href="@{/}">WebTestHelper</a>
                <span>/</span>
                <span th:text="#{ui.titel.uebersicht}">Übersicht</span>
            </div>
            <div class="abschnitt-ueberschrift-zeile" style="border-bottom: none; margin-bottom: 0; padding-bottom: 0;">
                <h1 class="page-main-title" th:text="#{ui.titel.uebersicht}">Übersicht</h1>
                <button type="button" class="hinweis-schalter" th:attr="aria-label=#{ui.hilfe.oeffnen}"
                        th:data-hx-get="@{/hilfe/hinweis/{id}(id='uebersicht')}"
                        data-hx-target="#hilfe-modal-inhalt" data-hx-swap="innerHTML" @click="hilfeModalOffen = true">
                    <span th:replace="~{fragments/icons :: help}"></span>
                </button>
                <div class="hinweis" aria-live="polite"></div>
            </div>
        </div>
        <div class="header-actions-cluster seiten-kopf-aktionen">
            <a sec:authorize="hasRole('ADMIN')" th:href="@{/websites/neu}" class="btn-ui btn-ui-primary button primär">
                <span th:replace="~{fragments/icons :: plus}"></span>
                <span th:text="#{ui.websites.neu}">Neue Website anlegen</span>
            </a>
        </div>
    </header>

    <!-- Dynamic live dashboard content (KPIs, capacity, tiles) -->
    <div th:replace="~{fragments/kacheln :: kacheln}"></div>
</main>
</body>
</html>
