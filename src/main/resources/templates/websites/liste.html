<!DOCTYPE html>
<html th:replace="~{layout :: seite(#{ui.titel.websites}, ~{::main})}" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title th:text="#{ui.titel.websites}">Websites</title>
</head>
<body>
<main>
    <header class="seiten-kopf">
        <h1 th:text="#{ui.titel.websites}">Websites</h1>
        <div sec:authorize="hasRole('ADMIN')">
            <a th:href="@{/websites/neu}" class="button primär" th:text="#{ui.websites.neu}">Neue Website anlegen</a>
        </div>
    </header>

    <div th:if="${flashMessage}" class="erfolgs-meldung" role="status" th:text="${flashMessage}"></div>

    <div th:if="${#lists.isEmpty(sites)}" class="leer-zustand">
        <p th:text="#{ui.websites.leer}">Noch keine Websites vorhanden.</p>
    </div>

    <table th:if="${not #lists.isEmpty(sites)}" class="daten-tabelle">
        <thead>
            <tr>
                <th th:text="#{ui.websites.tabelle.name}">Name</th>
                <th th:text="#{ui.websites.tabelle.url}">Basis-URL</th>
                <th th:text="#{ui.websites.tabelle.status}">Status</th>
                <th th:text="#{ui.websites.tabelle.pruefungen}">Prüfungen</th>
                <th th:text="#{ui.websites.tabelle.aktionen}">Aktionen</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="site : ${sites}">
                <td>
                    <a th:href="@{/websites/{id}(id=${site.id})}" th:text="${site.name}">Site Name</a>
                </td>
                <td>
                    <a th:href="${site.baseUrl}" th:text="${site.baseUrl}" target="_blank" rel="noopener noreferrer">https://example.com/</a>
                </td>
                <td>
                    <span th:if="${site.enabled}" class="status-badge status-aktiv" th:text="#{ui.websites.status.aktiv}">Aktiv</span>
                    <span th:unless="${site.enabled}" class="status-badge status-inaktiv" th:text="#{ui.websites.status.inaktiv}">Inaktiv</span>
                </td>
                <td th:text="${site.settingCount}">10</td>
                <td>
                    <a sec:authorize="hasRole('ADMIN')" th:href="@{/websites/{id}/bearbeiten(id=${site.id})}" th:text="#{ui.websites.aktionen.bearbeiten}">Bearbeiten</a>
                    <form sec:authorize="hasRole('ADMIN')" th:action="@{/websites/{id}/loeschen(id=${site.id})}" method="post" class="inline-form">
                        <button type="submit" class="button link-loeschen"
                                th:attr="onclick='return confirm(\'' + #{ui.websites.loeschen.bestaetigung} + '\')'"
                                th:text="#{ui.websites.loeschen}">Löschen</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>
</main>
</body>
</html>
