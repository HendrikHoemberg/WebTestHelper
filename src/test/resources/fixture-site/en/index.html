<head><meta charset="utf-8"><title>Startseite — Fixture</title>

       as a dead alternate. -->
  <link rel="alternate" hreflang="de" href="/">
  <link rel="alternate" hreflang="fr" href="http://127.0.0.1:{{PORT}}/hart-404">
</head>
