spring.application.name=webtesthelper

spring.datasource.url=${WTH_DB_URL:jdbc:postgresql://localhost:5432/webtesthelper}
spring.datasource.username=${WTH_DB_USER:webtesthelper}
spring.datasource.password=${WTH_DB_PASSWORD:webtesthelper}

# Flyway owns the schema. validate must never be relaxed (spec 6.5).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false
spring.web.locale=de
spring.web.locale-resolver=fixed

spring.threads.virtual.enabled=false

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

webtesthelper.data-dir=${WTH_DATA_DIR:./data}
webtesthelper.crawler.browser-workers=${WTH_BROWSER_WORKERS:4}
webtesthelper.crawler.batch-size=20
webtesthelper.crawler.navigation-timeout=30s
webtesthelper.crawler.per-host-delay=250ms
webtesthelper.crawler.artifact-dir=${webtesthelper.data-dir}/artifacts
webtesthelper.crawler.headless=true
webtesthelper.crawler.no-sandbox=${WTH_CHROMIUM_NO_SANDBOX:false}

webtesthelper.recorder.max-sessions=2
webtesthelper.recorder.idle-timeout=15m
webtesthelper.recorder.frame-quality=60
webtesthelper.recorder.viewport-width=1280
webtesthelper.recorder.viewport-height=720
webtesthelper.recorder.headless=true
webtesthelper.recorder.no-sandbox=${WTH_CHROMIUM_NO_SANDBOX:false}
webtesthelper.recorder.idle-reaper-interval=30s
webtesthelper.recorder.idle-reaper-enabled=true
webtesthelper.recorder.pump-interval=100ms

webtesthelper.setup.probe-pages=8
webtesthelper.setup.probe-timeout=120s

webtesthelper.checks.interaction.max-targets=3
webtesthelper.checks.interaction.timeout=30s

webtesthelper.verifier.per-host-permits=4
webtesthelper.verifier.request-timeout=10s
webtesthelper.verifier.success-ttl=24h
webtesthelper.verifier.failure-ttl=1h
webtesthelper.verifier.reverify-attempts=2
webtesthelper.verifier.reverify-delay=2s

webtesthelper.findings.site-wide-threshold=5
webtesthelper.findings.max-mute-days=365
webtesthelper.findings.page-size=50
webtesthelper.findings.mute-sweep-cron=0 15 * * * *
webtesthelper.findings.mute-sweep-enabled=true

webtesthelper.admin.username=${WTH_ADMIN_USER:admin}
webtesthelper.admin.password=${WTH_ADMIN_PASSWORD:}

webtesthelper.smtp.host=${WTH_SMTP_HOST:}
webtesthelper.smtp.port=${WTH_SMTP_PORT:}
webtesthelper.smtp.tls=${WTH_SMTP_TLS:}
webtesthelper.smtp.user=${WTH_SMTP_USER:}
webtesthelper.smtp.password=${WTH_SMTP_PASSWORD:}
webtesthelper.smtp.from=${WTH_SMTP_FROM:}
webtesthelper.base-url=${WTH_BASE_URL:}

webtesthelper.imap.host=${WTH_IMAP_HOST:}
webtesthelper.imap.port=${WTH_IMAP_PORT:}
webtesthelper.imap.tls=${WTH_IMAP_TLS:}
webtesthelper.imap.user=${WTH_IMAP_USER:}
webtesthelper.imap.password=${WTH_IMAP_PASSWORD:}
webtesthelper.imap.folder=${WTH_IMAP_FOLDER:INBOX}
webtesthelper.imap.verification-address=${WTH_IMAP_ADDRESS:${WTH_IMAP_VERIFICATION_ADDRESS:}}

webtesthelper.runner.poll-interval=5s
webtesthelper.runner.poller-enabled=true
webtesthelper.runner.lease-reclaim-interval=60s
webtesthelper.runner.lease-reclaim-enabled=true
webtesthelper.runner.key-pages=10
webtesthelper.runner.artifact-retention-runs=12
webtesthelper.runner.retention-enabled=true
webtesthelper.runner.retention-cron=0 30 4 * * *

webtesthelper.dashboard.poll-interval=30s

webtesthelper.reporting.dispatch-interval=30s
webtesthelper.reporting.max-attempts=5
webtesthelper.reporting.dispatcher-enabled=true
webtesthelper.reporting.digest-settle=5m
webtesthelper.reporting.digest-max-wait=6h
webtesthelper.reporting.digest-interval=2m
webtesthelper.reporting.digest-enabled=true
# Applied per section, so a site lists at most this many new AND this many regressed findings.
# The rest are a count with a link; INFO is never listed (D58).
webtesthelper.reporting.digest-max-findings=10

# D60: seven scheduler threads: outbox dispatcher, schedule tick, artifact retention, mute sweep,
# digest, recorder idle reaper, lease reclaim.
spring.task.scheduling.pool.size=7

webtesthelper.scheduling.tick-interval=30s
webtesthelper.scheduling.tick-enabled=true
webtesthelper.scheduling.batch-size=50