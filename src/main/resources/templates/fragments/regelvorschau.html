<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="regelvorschau" class="regelvorschau" style="padding: 0.6rem 0.85rem; background: var(--surface-subtle); border-left: 3px solid #09090b; border-radius: 0 6px 6px 0;">
    <span class="treffer-text" th:if="${trefferAnzahl != null}" style="font-size: 0.85rem; color: var(--text-main); font-weight: 500;"
          th:text="#{ui.stummschaltungen.vorschau.treffer(${trefferAnzahl})}">Trifft aktuell auf 0 Feststellungen zu.</span>
    <span class="treffer-text" th:if="${trefferAnzahl == null}" style="font-size: 0.85rem; color: var(--text-muted); font-weight: 500;"
          th:text="#{ui.stummschaltungen.vorschau.hinweis}">Geben Sie ein Muster ein, um eine Vorschau zu sehen.</span>
</div>
</body>
</html>
