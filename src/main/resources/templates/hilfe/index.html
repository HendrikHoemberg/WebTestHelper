<!DOCTYPE html>
<html th:replace="~{layout :: seite(#{ui.hilfe.titel}, ~{::main})}"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title th:text="#{ui.hilfe.titel}">Handbuch</title>
</head>
<body>
<main>
    <header class="page-header-bar seiten-kopf">
        <div>
            <div class="breadcrumbs-trail">
                <a th:href="@{/}">WebTestHelper</a>
                <span>/</span>
                <span th:text="#{ui.hilfe.titel}">Handbuch</span>
            </div>
            <h1 class="page-main-title handbuch-titel" th:text="#{ui.hilfe.titel}">Handbuch</h1>
        </div>
    </header>

    <div class="handbuch-suche-feld">
        <form th:action="@{/handbuch}" method="get" class="suchfeld-form" role="search">
            <span class="suchfeld-icon">
                <span th:replace="~{fragments/icons :: search}"></span>
            </span>
            <input type="search"
                   name="q"
                   th:value="${q}"
                   th:placeholder="#{ui.hilfe.suche.platzhalter}"
                   th:aria-label="#{ui.hilfe.suche.platzhalter}"
                   class="form-input"
                   hx-get="/handbuch"
                   hx-trigger="input changed delay:200ms, search"
                   hx-target="#themen-liste"
                   hx-push-url="true">
        </form>
    </div>

    <div id="themen-liste" th:fragment="themenListe">
        <div th:if="${#lists.isEmpty(topics)}" class="card-box leer-zustand" style="padding: 3rem 1.5rem; text-align: center;">
            <p th:if="${#strings.isEmpty(q)}" th:text="#{ui.hilfe.leer}" style="color: var(--text-muted); font-size: 0.95rem;">Noch keine Hilfethemen vorhanden.</p>
            <p th:if="${not #strings.isEmpty(q)}" th:text="${#messages.msg('ui.hilfe.suche.keine_treffer', q)}" style="color: var(--text-muted); font-size: 0.95rem;">Keine Hilfethemen gefunden.</p>
        </div>

        <div th:if="${not #lists.isEmpty(topics)}" class="hilfe-themen-liste">
            <article th:each="topic : ${topics}" class="card-box detail-bereich hilfe-thema-karte">
                <div class="hilfe-kachel-inhalt">
                    <h2 style="font-size: 1.1rem; margin-top: 0; margin-bottom: 0.5rem; line-height: 1.35;">
                        <a th:href="@{/handbuch/{id}(id=${topic.id})}" th:text="${topic.title}" class="hilfe-titel-link" style="color: var(--text-main); text-decoration: none;">Thementitel</a>
                    </h2>
                    <div class="hilfe-teaser" style="font-size: 0.875rem; color: var(--text-muted); line-height: 1.5;" th:utext="${topic.teaserHtml}">Teaser-Text...</div>
                </div>
                <div class="hilfe-kachel-aktion">
                    <a th:href="@{/handbuch/{id}(id=${topic.id})}" class="hilfe-link-icon" th:title="#{ui.hilfe.thema_oeffnen}" th:aria-label="${topic.title} + ' – ' + #{ui.hilfe.thema_oeffnen}">
                        <span th:replace="~{fragments/icons :: arrow_right}"></span>
                    </a>
                </div>
            </article>
        </div>
    </div>
</main>
</body>
</html>
