spring.application.name=webtesthelper

spring.datasource.url=${WTH_DB_URL:jdbc:postgresql://localhost:5432/webtesthelper}
spring.datasource.username=${WTH_DB_USER:webtesthelper}
spring.datasource.password=${WTH_DB_PASSWORD:webtesthelper}

# Flyway owns the schema. validate must never be relaxed (spec 6.5).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false
spring.web.locale=de
spring.web.locale-resolver=fixed

spring.threads.virtual.enabled=false

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

webtesthelper.data-dir=${WTH_DATA_DIR:./data}
webtesthelper.crawler.browser-workers=${WTH_BROWSER_WORKERS:4}
webtesthelper.crawler.batch-size=20
webtesthelper.crawler.navigation-timeout=30s
webtesthelper.crawler.per-host-delay=250ms
webtesthelper.crawler.artifact-dir=${webtesthelper.data-dir}/artifacts
webtesthelper.crawler.headless=true

webtesthelper.verifier.per-host-permits=4
webtesthelper.verifier.request-timeout=10s
webtesthelper.verifier.success-ttl=24h
webtesthelper.verifier.failure-ttl=1h
webtesthelper.verifier.reverify-attempts=2
webtesthelper.verifier.reverify-delay=2s

webtesthelper.findings.site-wide-threshold=5

webtesthelper.admin.username=${WTH_ADMIN_USER:admin}
webtesthelper.admin.password=${WTH_ADMIN_PASSWORD:}

webtesthelper.smtp.host=${WTH_SMTP_HOST:}
webtesthelper.smtp.port=${WTH_SMTP_PORT:}
webtesthelper.smtp.tls=${WTH_SMTP_TLS:}
webtesthelper.smtp.user=${WTH_SMTP_USER:}
webtesthelper.smtp.password=${WTH_SMTP_PASSWORD:}
webtesthelper.smtp.from=${WTH_SMTP_FROM:}
webtesthelper.base-url=${WTH_BASE_URL:}

webtesthelper.runner.poll-interval=5s
webtesthelper.runner.poller-enabled=true

webtesthelper.reporting.dispatch-interval=30s
webtesthelper.reporting.max-attempts=5
webtesthelper.reporting.dispatcher-enabled=true

# D43: one scheduler thread is not enough once the outbox, the schedule tick and (Task 6) a
# third job all run on it.
spring.task.scheduling.pool.size=3

webtesthelper.scheduling.tick-interval=30s
webtesthelper.scheduling.tick-enabled=true
webtesthelper.scheduling.batch-size=50


