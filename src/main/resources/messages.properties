# Der Prüfkatalog in der Sprache der Kolleginnen und Kollegen, die den Bericht lesen
# (Spezifikation 13.1). Interne Bezeichner erscheinen hier nie.
# Zu jeder Prüfung gehören drei Schlüssel: was geprüft wird, was gefunden wurde, was zu tun ist.

check.PAGE_STATUS.title=Seitenstatus
check.PAGE_STATUS.description=Prüft, ob eine Seite normal ausgeliefert wird und nicht in Wahrheit die Fehlerseite der Website zeigt.
check.PAGE_STATUS.remediation=Seite im Browser aufrufen. Gibt es sie nicht mehr, den Verweis darauf entfernen oder eine Weiterleitung auf die passende neue Seite einrichten.
finding.PAGE_STATUS.httpError=Der Server beantwortet diese Seite mit dem Fehlercode {0}.
finding.PAGE_STATUS.soft404=Die Seite meldet Erfolg, zeigt aber denselben Inhalt wie die Fehlerseite der Website. Besucher landen hier in einer Sackgasse.

check.PAGE_UNREACHABLE.title=Seite nicht erreichbar
check.PAGE_UNREACHABLE.description=Prüft, ob sich eine Seite überhaupt laden lässt.
check.PAGE_UNREACHABLE.remediation=Seite selbst im Browser aufrufen. Bleibt sie hängen, Serverprotokoll und Antwortzeiten prüfen. Tritt der Fehler nur einmal auf, war es meist eine kurzzeitige Störung.
finding.PAGE_UNREACHABLE.navigation=Die Seite liess sich nicht laden: {0}

check.REDIRECT_CHAIN.title=Weiterleitungen
check.REDIRECT_CHAIN.description=Prüft, ob Weiterleitungen ans Ziel führen und nicht über unnötig viele Zwischenstationen laufen.
check.REDIRECT_CHAIN.remediation=Weiterleitung so einrichten, dass sie direkt auf die Zielseite zeigt, und die Verweise im Inhalt auf die Zieladresse umstellen.
finding.REDIRECT_CHAIN.tooManyHops=Der Aufruf läuft über {0} Weiterleitungen, bis er bei {1} ankommt.
finding.REDIRECT_CHAIN.loop=Die Weiterleitungen verweisen im Kreis aufeinander, die Seite wird nie ausgeliefert.

check.IMAGE_BROKEN.title=Fehlende Bilder
check.IMAGE_BROKEN.description=Prüft, ob jedes eingebundene Bild tatsächlich angezeigt wird. Ein Bild kann eingebunden sein und trotzdem leer bleiben.
check.IMAGE_BROKEN.remediation=Bilddatei hochladen oder den Verweis im Inhalt auf die richtige Datei korrigieren.
finding.IMAGE_BROKEN.notRendered=Das Bild {0} bleibt leer.

check.MEDIA_PLAYABLE.title=Video und Ton
check.MEDIA_PLAYABLE.description=Prüft, ob eingebundene Videos und Tonspuren abspielbar sind.
check.MEDIA_PLAYABLE.remediation=Mediendatei prüfen: Ist sie vorhanden, ist das Format für Browser geeignet, stimmt der Verweis darauf?
finding.MEDIA_PLAYABLE.video=Das eingebundene Video {0} lässt sich nicht abspielen.
finding.MEDIA_PLAYABLE.audio=Die eingebundene Tonspur {0} lässt sich nicht abspielen.

check.MIXED_CONTENT.title=Unsichere Inhalte auf sicherer Seite
check.MIXED_CONTENT.description=Prüft, ob eine verschlüsselt ausgelieferte Seite Bilder oder andere Bestandteile unverschlüsselt nachlädt.
check.MIXED_CONTENT.remediation=Verweis auf die verschlüsselte Adresse umstellen. Sonst blockiert der Browser diese Bestandteile und das Schloss-Symbol verschwindet.
finding.MIXED_CONTENT.insecureSubresource=Die Seite lädt {0} unverschlüsselt nach.

check.IFRAME_EMBED.title=Eingebettete Inhalte
check.IFRAME_EMBED.description=Prüft eingebettete Fremdinhalte wie Karten oder Bewertungen darauf, ob sie angezeigt werden statt leer oder blockiert zu bleiben.
check.IFRAME_EMBED.remediation=Bei Karten den Abrechnungsstatus und den Schlüssel beim Anbieter prüfen. Bei blockierten Inhalten erlaubt der Anbieter die Einbettung nicht; Einbettungscode dort neu holen.
finding.IFRAME_EMBED.blocked=Der eingebettete Inhalt {0} wird vom Anbieter nicht zur Einbettung freigegeben und bleibt leer.
finding.IFRAME_EMBED.maps=Die eingebettete Karte zeigt nur eine graue Fläche. Der Kartenanbieter lehnt den Zugriff ab und meldet dazu: {0}
finding.IFRAME_EMBED.mapsNotPainted=Die eingebettete Karte {0} zeigt nur eine leere Fläche: Der Karteninhalt wurde nicht gerendert. Bitte Karten-Schlüssel und Abrechnungsstatus prüfen.
finding.IFRAME_EMBED.empty=Der eingebettete Inhalt {0} lädt, zeigt aber nichts an.

check.CONSOLE_ERRORS.title=Fehlermeldungen im Browser
check.CONSOLE_ERRORS.description=Prüft, ob die Seite beim Laden Programmfehler meldet. Standardmäßig abgeschaltet, weil eingebundene Fremdskripte laufend harmlose Meldungen erzeugen.
check.CONSOLE_ERRORS.remediation=Meldung an die Entwicklung weitergeben. Wiederkehrende harmlose Meldungen in die Ausnahmeliste dieser Prüfung aufnehmen.
finding.CONSOLE_ERRORS.uncaught=Beim Laden der Seite meldet der Browser einen Fehler: {0}

check.DEAD_LINK.title=Tote Links
check.DEAD_LINK.description=Prüft, ob jeder Verweis noch zu einer Seite oder Datei führt — auf dieser Website wie auf fremden.
check.DEAD_LINK.remediation=Verweis auf die richtige Adresse korrigieren oder entfernen. Zeigt er auf eine fremde Website, dort die neue Adresse suchen.
finding.DEAD_LINK.dead=Der Verweis führt ins Leere ({1}).
finding.DEAD_LINK.unverifiable=Der Verweis liess sich nicht prüfen, weil die fremde Website unsere Anfrage abweist ({1}). Bitte einmal von Hand aufrufen.
finding.DEAD_LINK.technicalFailure=Der Verweis konnte wegen einer technischen Störung nicht geprüft werden ({1}).

check.FILE_DOWNLOAD.title=Dateien zum Herunterladen
check.FILE_DOWNLOAD.description=Prüft, ob verlinkte Dateien wirklich als Datei ankommen und nicht als Fehler- oder Anmeldeseite.
check.FILE_DOWNLOAD.remediation=Datei erneut hochladen und den Verweis darauf prüfen. Liegt sie hinter einer Anmeldung, auf eine öffentlich erreichbare Fassung verweisen.
finding.FILE_DOWNLOAD.wrongType=Statt der Datei {0} liefert der Server eine Webseite aus ({1}).
finding.FILE_DOWNLOAD.notAPdf=Die Datei {0} wird als PDF angeboten, ihr Inhalt ist aber kein PDF.
finding.FILE_DOWNLOAD.tooSmall=Die Datei {0} ist mit {1} Byte zu klein, um Inhalt zu enthalten.

check.TLS_CERT.title=Verschlüsselung der Website
check.TLS_CERT.description=Prüft das Sicherheitszertifikat der Website auf Gültigkeit und Restlaufzeit.
check.TLS_CERT.remediation=Zertifikat beim Anbieter erneuern lassen. Läuft es ab, warnen Browser die Besucher und die meisten brechen ab.
finding.TLS_CERT.handshakeFailed=Die verschlüsselte Verbindung zu {0} kam nicht zustande: {1}
finding.TLS_CERT.expired=Das Sicherheitszertifikat für {0} ist seit dem {1} abgelaufen.
finding.TLS_CERT.expiringSoon=Das Sicherheitszertifikat für {0} läuft in {1} Tagen ab.

check.HREFLANG.title=Sprachverweise
check.HREFLANG.description=Prüft die Verweise zwischen den Sprachfassungen einer Seite: Gibt es die angegebene Fassung, und verweist sie zurück?
check.HREFLANG.remediation=Sprachverweis auf die richtige Adresse korrigieren und in der anderen Sprachfassung den Rückverweis ergänzen.
finding.HREFLANG.invalidLanguage=Die Sprachangabe „{0}" auf {1} ist keine gültige Sprachkennung.
finding.HREFLANG.deadAlternate=Die angegebene Sprachfassung {0} („{1}") gibt es nicht.
finding.HREFLANG.notReciprocated={0} verweist auf die Sprachfassung {1}, diese aber nicht zurück.

check.SITEMAP_CONSISTENCY.title=Inhaltsverzeichnis der Website
check.SITEMAP_CONSISTENCY.description=Vergleicht das Inhaltsverzeichnis (sitemap.xml) mit den tatsächlich vorhandenen Seiten. Standardmäßig abgeschaltet, weil viele Seiten dort zu Recht fehlen.
check.SITEMAP_CONSISTENCY.remediation=Eintrag aus dem Inhaltsverzeichnis entfernen oder die fehlende Seite dort ergänzen. Das Verzeichnis erzeugt meist das Redaktionssystem.
finding.SITEMAP_CONSISTENCY.deadEntry=Das Inhaltsverzeichnis führt {0} auf, diese Seite gibt es aber nicht.
finding.SITEMAP_CONSISTENCY.missingPage=Die Seite {0} fehlt im Inhaltsverzeichnis der Website.

check.COOKIE_BANNER.title=Cookie-Hinweis
check.COOKIE_BANNER.description=Prüft, ob sich der Cookie-Hinweis der Website wegklicken lässt. Bleibt er stehen, kommen Besucher nicht an den Inhalt.
check.COOKIE_BANNER.remediation=Die Seite selbst aufrufen und den Zustimmen-Knopf drücken. Passiert nichts, lädt das Skript des Cookie-Werkzeugs nicht mehr — Einbindung und Konto beim Anbieter prüfen.
finding.COOKIE_BANNER.undismissable=Der Cookie-Hinweis „{0}“ lässt sich nicht wegklicken. Besucher kommen nicht an den Inhalt der Seite.

check.LANGUAGE_SWITCHER.title=Sprachumschalter
check.LANGUAGE_SWITCHER.description=Prüft, ob die Sprachwahl wirklich in die andere Sprache führt: Adresse, Sprachkennzeichnung und der sichtbare Text müssen sich ändern.
check.LANGUAGE_SWITCHER.remediation=Die Sprachwahl selbst anklicken und die Zielseite ansehen. Steht dort derselbe Text, fehlt die Übersetzung im Redaktionssystem; bleibt die Adresse gleich, ist gar kein Ziel hinterlegt.
finding.LANGUAGE_SWITCHER.noNavigation=Die Sprachwahl „{0}“ führt nirgendwohin — die Adresse der Seite bleibt dieselbe.
finding.LANGUAGE_SWITCHER.langUnchanged=Die Seite {0} hinter der Sprachwahl „{1}“ ist weiterhin als „{2}“ ausgezeichnet.
finding.LANGUAGE_SWITCHER.sameContent=Hinter der Sprachwahl „{0}“ steht auf {1} derselbe Text wie auf der Ausgangsseite. Die Übersetzung fehlt.

check.BUTTON_REACHABILITY.title=Schaltflächen
check.BUTTON_REACHABILITY.description=Klickt sichtbare Schaltflächen an und prüft, ob überhaupt etwas passiert — eine neue Seite, ein sich öffnender Bereich, ein Hinweisfenster — und ob eine so geöffnete Seite auch wirklich vorhanden ist. Formulare und Knöpfe wie „Löschen“ bleiben unberührt.
check.BUTTON_REACHABILITY.remediation=Die Schaltfläche selbst anklicken. Passiert nichts, fehlt die Verknüpfung, oder das Skript dahinter wird nicht mehr geladen. Öffnet sich eine Fehlerseite, zeigt die Schaltfläche auf eine Adresse, die es nicht mehr gibt — das Ziel im Redaktionssystem korrigieren.
finding.BUTTON_REACHABILITY.dead=Die Schaltfläche „{0}“ auf {1} bewirkt nichts.
finding.BUTTON_REACHABILITY.deadTarget=Die Schaltfläche „{0}“ führt zu {1}, dort antwortet die Website mit dem Fehler {2}.

check.CONTACT_FORM.title=Kontaktformular
check.CONTACT_FORM.description=Füllt das Kontaktformular mit Testdaten aus und prüft, ob es sich überhaupt abschicken lässt. Je nach Einstellung wird zusätzlich abgeschickt und die Zustellung nachgewiesen.
check.CONTACT_FORM.remediation=Das Formular selbst ausfüllen und abschicken. Lässt es sich nicht absenden, fehlt meist eine Auswahlmöglichkeit in einem Pflichtfeld; kommt keine Nachricht an, prüfen Sie die Empfängeradresse im Redaktionssystem.
finding.CONTACT_FORM.rejectsValid=Das Formular auf {0} lässt sich nicht abschicken: das Pflichtfeld „{1}“ nimmt keine gültige Eingabe an.
finding.CONTACT_FORM.acceptsInvalid=Das Formular auf {0} akzeptiert „{1}“ als E-Mail-Adresse. Fehleingaben fallen niemandem auf.
finding.CONTACT_FORM.noSuccess=Das Formular auf {0} wurde abgeschickt, aber die Seite bestätigt den Versand nicht.
finding.CONTACT_FORM.errorShown=Das Formular auf {0} meldet beim Abschicken einen Fehler.
finding.CONTACT_FORM.notDelivered=Das Formular auf {0} meldet „{1}“, aber die Nachricht ist innerhalb von {2} Sekunden nicht im Prüfpostfach angekommen.

check.JOURNEY_STEP_FAILED.title=Benutzerabläufe
check.JOURNEY_STEP_FAILED.description=Führt mehrstufige Benutzerinteraktionen schrittweise aus und prüft, ob jeder Schritt erfolgreich durchläuft.
check.JOURNEY_STEP_FAILED.remediation=Den betroffenen Ablauf in den Website-Details prüfen. Gegebenenfalls den Einzelschritt korrigieren oder die Website anpassen.

check.SELECTOR_DRIFT.title=Selektor-Drift
check.SELECTOR_DRIFT.description=Erkennt, wenn Elemente in Benutzerabläufen über Ausweich-Selektoren gefunden werden statt über das bevorzugte Erkennungsmuster.
check.SELECTOR_DRIFT.remediation=Den Ablauf bei Gelegenheit überprüfen oder neu aufzeichnen, bevor strukturelle Änderungen der Website zum Fehlschlagen der Prüfung führen.

