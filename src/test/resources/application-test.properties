spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.main.banner-mode=off
webtesthelper.data-dir=${java.io.tmpdir}/webtesthelper-test
logging.level.org.testcontainers=WARN
logging.level.com.github.dockerjava=WARN

webtesthelper.crawler.browser-workers=2
webtesthelper.crawler.batch-size=10
webtesthelper.crawler.navigation-timeout=5s
webtesthelper.crawler.per-host-delay=0s
webtesthelper.crawler.artifact-dir=${java.io.tmpdir}/webtesthelper-test/artifacts
webtesthelper.crawler.headless=true

webtesthelper.verifier.per-host-permits=4
webtesthelper.verifier.request-timeout=3s
webtesthelper.verifier.success-ttl=24h
webtesthelper.verifier.failure-ttl=1h
webtesthelper.verifier.reverify-delay=100ms

webtesthelper.runner.poller-enabled=false
webtesthelper.runner.retention-enabled=false
webtesthelper.reporting.dispatcher-enabled=false
webtesthelper.scheduling.tick-enabled=false
webtesthelper.findings.mute-sweep-enabled=false

