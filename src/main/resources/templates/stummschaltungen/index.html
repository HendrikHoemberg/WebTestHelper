<!DOCTYPE html>
<html th:replace="~{layout :: seite(#{ui.titel.stummschaltungen}, ~{::main})}" xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="#{ui.titel.stummschaltungen}">Stummschaltungen</title>
</head>
<body>
<main>
    <header class="seiten-kopf">
        <div class="seiten-kopf-titel-zeile">
            <h1 th:text="#{ui.stummschaltungen.titel}">Stummschaltungen</h1>
            <button type="button" class="hinweis-schalter" th:attr="aria-label=#{ui.hilfe.oeffnen}"
                    th:data-hx-get="@{/hilfe/hinweis/{id}(id='stummschaltungen')}"
                    data-hx-target="next .hinweis" data-hx-swap="innerHTML">?</button>
            <div class="hinweis" aria-live="polite"></div>
        </div>
    </header>

    <div th:if="${flashMessage}" class="erfolgs-meldung" role="status" th:text="${flashMessage}"></div>
    <div th:if="${flashError}" class="fehler-meldung" role="alert" th:text="${flashError}"></div>

    <section class="detail-bereich">
        <h2 th:text="#{ui.stummschaltungen.neu.titel}">Neue Stummschaltung anlegen</h2>
        <form th:action="@{/stummschaltungen}" method="post" class="formular-bereich">
            <div class="form-raster">
                <div class="form-gruppe">
                    <label for="siteId" th:text="#{ui.stummschaltungen.neu.website}">Website</label>
                    <select id="siteId" name="siteId" class="form-eingabe"
                            th:attr="data-hx-get=@{/stummschaltungen/vorschau}"
                            data-hx-trigger="change"
                            data-hx-target="#regelvorschau"
                            data-hx-include="closest form">
                        <option value="" th:text="#{ui.stummschaltungen.neu.website.global}">Alle Websites (global)</option>
                        <option th:each="site : ${sites}" th:value="${site.id}" th:text="${site.name}"></option>
                    </select>
                </div>

                <div class="form-gruppe">
                    <label for="checkType" th:text="#{ui.stummschaltungen.neu.pruefungsart}">Prüfungsart</label>
                    <select id="checkType" name="checkType" class="form-eingabe"
                            th:attr="data-hx-get=@{/stummschaltungen/vorschau}"
                            data-hx-trigger="change"
                            data-hx-target="#regelvorschau"
                            data-hx-include="closest form">
                        <option value="" th:text="#{ui.stummschaltungen.neu.pruefungsart.alle}">Alle Prüfungsarten</option>
                        <option th:each="ct : ${checkTypes}" th:value="${ct.name()}" th:text="#{${'check.' + ct.name() + '.title'}}"></option>
                    </select>
                </div>

                <div class="form-gruppe">
                    <label for="subjectPattern" th:text="#{ui.stummschaltungen.neu.subject_pattern}">Betreff-Muster</label>
                    <input type="text" id="subjectPattern" name="subjectPattern" class="form-eingabe"
                           th:placeholder="#{ui.stummschaltungen.neu.subject_pattern.placeholder}"
                           th:attr="data-hx-get=@{/stummschaltungen/vorschau}"
                           data-hx-trigger="input changed delay:300ms, change"
                           data-hx-target="#regelvorschau"
                           data-hx-include="closest form">
                </div>

                <div class="form-gruppe">
                    <label for="locationPattern" th:text="#{ui.stummschaltungen.neu.location_pattern}">Fundort-Muster</label>
                    <input type="text" id="locationPattern" name="locationPattern" class="form-eingabe"
                           th:placeholder="#{ui.stummschaltungen.neu.location_pattern.placeholder}"
                           th:attr="data-hx-get=@{/stummschaltungen/vorschau}"
                           data-hx-trigger="input changed delay:300ms, change"
                           data-hx-target="#regelvorschau"
                           data-hx-include="closest form">
                </div>
            </div>

            <div id="regelvorschau" class="regelvorschau-container">
                <div th:replace="~{fragments/regelvorschau :: regelvorschau}"></div>
            </div>

            <div class="form-gruppe">
                <label for="reason" th:text="#{ui.stummschaltungen.neu.grund}">Begründung</label>
                <input type="text" id="reason" name="reason" class="form-eingabe" required
                       th:placeholder="#{ui.stummschaltungen.neu.grund.placeholder}">
            </div>

            <div class="form-gruppe">
                <label for="expiresAt" th:text="#{ui.stummschaltungen.neu.stumm_bis}">Stumm bis</label>
                <input type="date" id="expiresAt" name="expiresAt" class="form-eingabe" required
                       th:value="${#temporals.format(form.expiresAt, 'yyyy-MM-dd')}">
            </div>

            <div class="form-aktionen">
                <button type="submit" class="button primär" th:text="#{ui.stummschaltungen.neu.anlegen}">Stummschaltung anlegen</button>
            </div>
        </form>
    </section>

    <section class="detail-bereich">
        <h2 th:text="#{ui.stummschaltungen.titel}">Stummschaltungen</h2>
        <div th:if="${#lists.isEmpty(rules)}" class="leer-zustand">
            <p th:text="#{ui.stummschaltungen.leer}">Keine Stummschaltungsregeln vorhanden.</p>
        </div>

        <div th:if="${!#lists.isEmpty(rules)}" class="tabelle-container">
            <table class="tabelle">
                <thead>
                    <tr>
                        <th th:text="#{ui.stummschaltungen.tabelle.website}">Website</th>
                        <th th:text="#{ui.stummschaltungen.tabelle.kriterium}">Kriterium</th>
                        <th th:text="#{ui.stummschaltungen.tabelle.grund}">Begründung</th>
                        <th th:text="#{ui.stummschaltungen.tabelle.erstellt_von}">Erstellt von</th>
                        <th th:text="#{ui.stummschaltungen.tabelle.stumm_bis}">Stumm bis</th>
                        <th th:text="#{ui.stummschaltungen.tabelle.status}">Status</th>
                        <th th:text="#{ui.stummschaltungen.tabelle.aktionen}">Aktionen</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="rule : ${rules}" th:class="${rule.isExpired(now) ? 'regel-abgelaufen' : 'regel-aktiv'}">
                        <td>
                            <span th:if="${rule.siteId != null}" th:text="${siteMap.get(rule.siteId) != null ? siteMap.get(rule.siteId) : ('Website #' + rule.siteId)}">Website</span>
                            <span th:if="${rule.siteId == null}" class="badge-global" th:text="#{ui.stummschaltungen.global}">Global (alle Websites)</span>
                        </td>
                        <td>
                            <span th:if="${rule.checkType != null}" class="kriterium-tag" th:text="#{${'check.' + rule.checkType.name() + '.title'}}">Check</span>
                            <code th:if="${rule.subjectPattern != null}" class="muster-code" th:text="${rule.subjectPattern}">*pattern*</code>
                            <code th:if="${rule.locationPattern != null}" class="muster-code" th:text="${rule.locationPattern}">*pattern*</code>
                        </td>
                        <td th:text="${rule.reason}">Begründung</td>
                        <td th:text="${rule.createdBy != null ? rule.createdBy : '-'}">Autor</td>
                        <td th:text="${#temporals.format(rule.expiresAt, 'dd.MM.yyyy')}">25.11.2026</td>
                        <td>
                            <span th:if="${rule.isExpired(now)}" class="status-badge abgelaufen" th:text="#{ui.stummschaltungen.status.abgelaufen}">Abgelaufen</span>
                            <span th:if="${!rule.isExpired(now)}" class="status-badge aktiv" th:text="#{ui.stummschaltungen.status.aktiv}">Aktiv</span>
                        </td>
                        <td>
                            <form th:action="@{/stummschaltungen/{id}/loeschen(id=${rule.id})}" method="post" class="inline-form">
                                <button type="submit" class="button link-loeschen"
                                        th:attr="onclick='return confirm(\'' + #{ui.stummschaltungen.loeschen.bestaetigung} + '\')'"
                                        th:text="#{ui.stummschaltungen.loeschen}">Löschen</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
</body>
</html>
