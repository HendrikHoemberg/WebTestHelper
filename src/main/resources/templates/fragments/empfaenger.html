<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<section class="card-box detail-bereich" th:fragment="empfaenger">
    <div class="abschnitt-ueberschrift-zeile" style="display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border-subtle); margin-bottom: 1rem; padding-bottom: 0.5rem;">
        <h2 style="margin: 0; border: none; padding: 0;" th:text="#{ui.websites.detail.empfaenger.titel}">Benachrichtigungsempfänger</h2>
        <button type="button" class="hinweis-schalter" th:attr="aria-label=#{ui.hilfe.oeffnen}"
                th:data-hx-get="@{/hilfe/hinweis/{id}(id='benachrichtigungen')}"
                data-hx-target="next .hinweis" data-hx-swap="innerHTML">?</button>
        <div class="hinweis" aria-live="polite"></div>
    </div>

    <!-- Case 1: Site has recipients -->
    <ul th:if="${not #lists.isEmpty(recipients)}" class="muster-liste empfaenger-liste" style="list-style: none; padding-left: 0; display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 1rem;">
        <li th:each="r : ${recipients}" class="empfaenger-zeile" style="display: flex; align-items: center; justify-content: space-between; padding: 0.5rem 0.75rem; background: var(--surface-subtle); border: 1px solid var(--border-subtle); border-radius: 6px;">
            <span th:text="${r.email}" style="font-weight: 500;">empfaenger@example.com</span>
            <form sec:authorize="hasRole('ADMIN')" th:action="@{/websites/{id}/empfaenger/{rid}/loeschen(id=${site.siteId}, rid=${r.id})}" method="post" class="inline-form">
                <button type="submit" class="btn-ui btn-ui-danger btn-ui-sm button sekundär klein" th:text="#{ui.websites.detail.empfaenger.loeschen}">Löschen</button>
            </form>
        </li>
    </ul>

    <!-- Case 2: Site has no recipients, but global fallback exists -->
    <p th:if="${#lists.isEmpty(recipients) and not #lists.isEmpty(fallbackRecipients)}" class="hinweis-text" style="font-size: 0.85rem; color: var(--text-muted);"
       th:text="#{ui.websites.detail.empfaenger.fallback_hinweis(${#strings.listJoin(fallbackRecipients, ', ')})}">
        Keine eigenen Empfänger hinterlegt. Benachrichtigungen werden an die Ausweichadresse fallback@example.com gesendet.
    </p>

    <!-- Case 3: Site has no recipients, and no global fallback exists -->
    <p th:if="${#lists.isEmpty(recipients) and #lists.isEmpty(fallbackRecipients)}" class="hinweis-text" style="font-size: 0.85rem; color: var(--status-error-dot); font-weight: 500;"
       th:text="#{ui.websites.detail.empfaenger.leer.warnung}">
        Keine Empfänger hinterlegt. Zu dieser Website werden keine Benachrichtigungen versendet.
    </p>

    <!-- Add recipient form (ADMIN only) -->
    <form sec:authorize="hasRole('ADMIN')" th:action="@{/websites/{id}/empfaenger(id=${site.siteId})}" method="post" class="empfaenger-formular" style="margin-top: 1rem; padding-top: 1rem; border-top: 1px solid var(--border-subtle);">
        <div class="form-gruppe">
            <label for="empfaenger-email" th:text="#{ui.websites.detail.empfaenger.neu.label}">E-Mail-Adresse</label>
            <input type="text" id="empfaenger-email" name="email" th:value="${email}" class="form-input" placeholder="name@example.com">
            <span th:if="${recipientError != null}" th:text="${recipientError}" class="feld-fehler">Fehler</span>
        </div>
        <div class="form-aktionen">
            <button type="submit" class="btn-ui btn-ui-secondary button primär" th:text="#{ui.websites.detail.empfaenger.neu.button}">Empfänger hinzufügen</button>
        </div>
    </form>
</section>
</body>
</html>
