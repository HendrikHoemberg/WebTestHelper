<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<div th:fragment="kopf(site, trafficLight)" class="page-header-bar seiten-kopf" x-data="{ loeschenOffen: false }">
    <div>
        <div class="breadcrumbs-trail">
            <a th:href="@{/}">WebTestHelper</a>
            <span>/</span>
            <a th:href="@{/websites}">Websites</a>
            <span>/</span>
            <span th:text="${site.name}">Website Name</span>
        </div>
        <h1 class="page-main-title" th:text="${site.name}">Website Name</h1>
        <div style="margin-top: 0.25rem; display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap;">
            <span class="status-badge"
                  th:classappend="${trafficLight.name() == 'GRUEN' ? 'badge-healthy' :
                                  (trafficLight.name() == 'ROT' ? 'badge-failing severity-CRITICAL' :
                                  (trafficLight.name() == 'GELB' ? 'badge-warning' : 'status-inaktiv'))}"
                  th:text="#{${'ui.trafficlight.' + trafficLight.name()}}">Grün</span>
            <a th:href="${site.baseUrl.value}" th:text="${site.baseUrl.value}" target="_blank" rel="noopener noreferrer"
               class="basis-url-link" style="font-family: var(--font-mono); font-size: 0.825rem; color: var(--text-muted); display: inline-flex; align-items: center; gap: 0.35rem;">
                <span th:replace="~{fragments/icons :: external_link}"></span>
                <span th:text="${site.baseUrl.value}">https://example.com/</span>
            </a>
        </div>
    </div>
    <div class="header-actions-cluster seiten-kopf-aktionen">
        <form th:action="@{/websites/{id}/pruefen(id=${site.siteId})}" method="post" class="inline-form">
            <button type="submit" class="btn-ui btn-ui-primary button primär">
                <span th:replace="~{fragments/icons :: play}"></span>
                <span th:text="#{ui.websites.detail.pruefen}">Jetzt prüfen</span>
            </button>
        </form>
        <details class="mehr-menue">
            <summary class="btn-ui btn-ui-secondary button sekundär" th:title="#{ui.websites.detail.mehr}">⋯</summary>
            <div class="mehr-menue-inhalt">
                <form th:action="@{/websites/{id}/einrichtung/neu(id=${site.siteId})}" method="post" class="inline-form">
                    <button type="submit" class="btn-ui btn-ui-secondary button sekundär"
                            th:text="#{ui.websites.detail.einrichtung_erneut}">Automatische Erkennung wiederholen</button>
                </form>
                <a sec:authorize="hasRole('ADMIN')" th:href="@{/websites/{id}/bearbeiten(id=${site.siteId})}"
                   class="btn-ui btn-ui-secondary button sekundär" th:text="#{ui.websites.detail.bearbeiten}">Bearbeiten</a>
                <button sec:authorize="hasRole('ADMIN')" type="button" class="btn-ui btn-ui-secondary btn-danger-hover button link-loeschen"
                        @click="loeschenOffen = true; $el.closest('details').removeAttribute('open')"
                        th:text="#{ui.websites.loeschen}">Löschen</button>
            </div>
        </details>
    </div>

    <!-- Löschen-Modal -->
    <div sec:authorize="hasRole('ADMIN')" x-cloak x-show="loeschenOffen" @keydown.escape.window="loeschenOffen = false" class="wth-modal" style="text-align: left;">
        <div class="wth-modal-backdrop" @click.self="loeschenOffen = false"></div>
        <div class="wth-modal-dialog" role="dialog" aria-modal="true" aria-labelledby="modal-kopf-loeschen-titel">
            <div class="wth-modal-kopf">
                <h2 id="modal-kopf-loeschen-titel" class="wth-modal-titel" th:text="#{ui.websites.loeschen.dialog.titel(${site.name})}">Website löschen</h2>
                <button type="button" class="wth-modal-schliessen" @click="loeschenOffen = false"
                        th:attr="aria-label=#{ui.dialog.schliessen}, title=#{ui.dialog.schliessen}">×</button>
            </div>
            <div class="wth-modal-inhalt">
                <p th:text="#{ui.websites.loeschen.bestaetigung}" style="margin-top: 0; margin-bottom: 1.25rem;">
                    Möchten Sie diese Website wirklich löschen? Abläufe, Zeitpläne, Zugangsdaten, Empfänger und der gesamte Prüfverlauf werden ebenfalls entfernt.
                </p>
                <form th:action="@{/websites/{id}/loeschen(id=${site.siteId})}" method="post" class="inline-form" style="display: flex; gap: 0.5rem; justify-content: flex-end;">
                    <button type="button" @click="loeschenOffen = false" class="btn-ui btn-ui-secondary" th:text="#{ui.dialog.abbrechen}">Abbrechen</button>
                    <button type="submit" class="btn-ui btn-ui-danger" th:text="#{ui.websites.loeschen.bestaetigen}">Jetzt löschen</button>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
