<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="relativzeit(bis)">
    <span th:if="${bis == null}" th:text="'-'">-</span>
    <span th:if="${bis != null}"
          th:with="dur=${T(java.time.Duration).between(T(java.time.Instant).now(), bis)}">
        <span th:if="${dur.toMinutes() < 1}"
              th:text="#{ui.uebersicht.naechster.kurz}">in Kürze</span>
        <span th:if="${dur.toMinutes() >= 1 and dur.toMinutes() < 60}"
              th:text="#{ui.uebersicht.naechster.min(${dur.toMinutes()})}">in 5 Minuten</span>
        <span th:if="${dur.toHours() >= 1 and dur.toHours() < 24}"
              th:text="#{ui.uebersicht.naechster.stunden(${dur.toHours()})}">in 3 Stunden</span>
        <span th:if="${dur.toDays() >= 1}"
              th:text="#{ui.uebersicht.naechster.tage(${dur.toDays()})}">in 2 Tagen</span>
    </span>
</th:block>
</body>
</html>
