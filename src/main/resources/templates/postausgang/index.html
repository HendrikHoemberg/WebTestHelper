<!DOCTYPE html>
<html th:replace="~{layout :: seite(#{ui.titel.postausgang}, ~{::main})}" xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="#{ui.titel.postausgang}">Postausgang</title>
</head>
<body>
<main>
    <header class="page-header-bar seiten-kopf">
        <div>
            <div class="breadcrumbs-trail">
                <a th:href="@{/}">WebTestHelper</a>
                <span>/</span>
                <span th:text="#{ui.titel.postausgang}">Postausgang</span>
            </div>
            <h1 class="page-main-title" th:text="#{ui.postausgang.titel}">Postausgang</h1>
        </div>
    </header>

    <div th:if="${#lists.isEmpty(eintraege)}" class="card-box leer-zustand" style="padding: 3rem 1.5rem; text-align: center;">
        <p th:text="#{ui.postausgang.leer}" style="color: var(--text-muted); font-size: 0.95rem;">Keine Benachrichtigungen vorhanden.</p>
    </div>

    <div th:if="${!#lists.isEmpty(eintraege)}" class="card-box tabelle-container" style="padding: 0; overflow: hidden;">
        <table class="daten-tabelle tabelle" style="margin-top: 0; border: none; border-radius: 0; box-shadow: none;">
            <thead>
                <tr>
                    <th th:text="#{ui.postausgang.tabelle.id}">ID</th>
                    <th th:text="#{ui.postausgang.tabelle.empfaenger}">Empfänger</th>
                    <th th:text="#{ui.postausgang.tabelle.betreff}">Betreff</th>
                    <th th:text="#{ui.postausgang.tabelle.status}">Status</th>
                    <th th:text="#{ui.postausgang.tabelle.versuche}">Versuche</th>
                    <th th:text="#{ui.postausgang.tabelle.erstellt}">Erstellt</th>
                    <th th:text="#{ui.postausgang.tabelle.gesendet}">Zugestellt</th>
                    <th th:text="#{ui.postausgang.tabelle.naechster_versuch}">Nächster Versuch</th>
                    <th th:text="#{ui.postausgang.tabelle.fehler}">Fehlermeldung</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="eintrag : ${eintraege}" th:class="${'status-' + eintrag.state}">
                    <td style="font-weight: 700; font-variant-numeric: tabular-nums;" th:text="${eintrag.id}">1</td>
                    <td th:text="${eintrag.recipient}">user@example.com</td>
                    <td style="font-weight: 500;" th:text="${eintrag.subject}">Betreff</td>
                    <td>
                        <span th:class="${'status-badge status-' + eintrag.state}"
                              th:classappend="${eintrag.state.name() == 'SENT' ? 'badge-healthy' : (eintrag.state.name() == 'FAILED' ? 'badge-failing' : 'status-inaktiv')}"
                              th:text="#{${'ui.notificationstate.' + eintrag.state}}">Ausstehend</span>
                    </td>
                    <td style="font-variant-numeric: tabular-nums;" th:text="${eintrag.attempts}">0</td>
                    <td style="font-variant-numeric: tabular-nums;" th:text="${#temporals.format(eintrag.createdAt, 'dd.MM.yyyy HH:mm:ss')}">01.01.2026 12:00:00</td>
                    <td style="font-variant-numeric: tabular-nums;" th:text="${eintrag.sentAt != null ? #temporals.format(eintrag.sentAt, 'dd.MM.yyyy HH:mm:ss') : '-'}">-</td>
                    <td style="font-variant-numeric: tabular-nums;" th:text="${eintrag.nextAttemptAt != null ? #temporals.format(eintrag.nextAttemptAt, 'dd.MM.yyyy HH:mm:ss') : '-'}">-</td>
                    <td class="fehler-text" style="font-family: var(--font-mono); font-size: 0.8rem; color: var(--status-error-dot);" th:text="${eintrag.lastError != null ? eintrag.lastError : '-'}">-</td>
                </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
