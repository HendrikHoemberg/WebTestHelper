<!DOCTYPE html>
<html th:replace="~{layout :: seite(#{ui.hilfe.titel}, ~{::main})}"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title th:text="#{ui.hilfe.titel}">Hilfe &amp; Handbuch</title>
</head>
<body>
<main>
    <header class="page-header-bar seiten-kopf">
        <div>
            <div class="breadcrumbs-trail">
                <a th:href="@{/}">WebTestHelper</a>
                <span>/</span>
                <span th:text="#{ui.hilfe.titel}">Handbuch</span>
            </div>
            <h1 class="page-main-title" th:text="#{ui.hilfe.titel}">Hilfe &amp; Handbuch</h1>
        </div>
    </header>

    <div class="card-box" style="margin-bottom: 1.5rem; display: flex; align-items: center; justify-content: space-between; gap: 1rem;">
        <div>
            <h2 style="font-size: 1.05rem; margin: 0 0 0.25rem; color: var(--text-main);" th:text="#{ui.tutorial.schritt1.titel}">Willkommen bei WebTestHelper</h2>
            <p style="margin: 0; font-size: 0.875rem; color: var(--text-muted);" th:text="#{ui.tutorial.schritt1.text}">WebTestHelper überwacht Ihre Websites automatisch...</p>
        </div>
        <form th:action="@{/tutorial/neustarten}" method="post" style="margin: 0; flex-shrink: 0;">
            <button type="submit" class="btn-ui btn-ui-primary" th:text="#{ui.tutorial.schaltflaeche.neustart}">Tour starten</button>
        </form>
    </div>


    <div th:if="${#lists.isEmpty(topics)}" class="card-box leer-zustand" style="padding: 3rem 1.5rem; text-align: center;">
        <p th:text="#{ui.hilfe.leer}" style="color: var(--text-muted); font-size: 0.95rem;">Noch keine Hilfethemen vorhanden.</p>
    </div>

    <div th:if="${not #lists.isEmpty(topics)}" class="hilfe-themen-liste">
        <article th:each="topic : ${topics}" class="card-box detail-bereich hilfe-thema-karte">
            <div class="hilfe-kachel-inhalt">
                <h2 style="font-size: 1.1rem; margin-top: 0; margin-bottom: 0.5rem;">
                    <a th:href="@{/hilfe/{id}(id=${topic.id})}" th:text="${topic.title}" class="hilfe-titel-link" style="color: var(--text-main); text-decoration: none;">Thementitel</a>
                </h2>
                <div class="hilfe-teaser" style="font-size: 0.875rem; color: var(--text-muted); line-height: 1.5; margin-bottom: 1rem;" th:utext="${topic.teaserHtml}">Teaser-Text...</div>
            </div>
            <div class="hilfe-kachel-aktion">
                <a th:href="@{/hilfe/{id}(id=${topic.id})}" class="btn-ui btn-ui-secondary btn-ui-sm button sekundär" th:text="#{ui.hilfe.mehr_dazu}">Mehr dazu im Handbuch</a>
            </div>
        </article>
    </div>
</main>
</body>
</html>
