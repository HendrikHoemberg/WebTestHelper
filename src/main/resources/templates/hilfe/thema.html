<!DOCTYPE html>
<html th:replace="~{layout :: seite(${topic.title} + ' – ' + #{ui.hilfe.titel}, ~{::main})}"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title th:text="${topic.title} + ' – ' + #{ui.hilfe.titel}">Hilfethema</title>
</head>
<body>
<main>
    <header class="page-header-bar seiten-kopf">
        <div>
            <div class="breadcrumbs-trail">
                <a th:href="@{/}">WebTestHelper</a>
                <span>/</span>
                <a th:href="@{/hilfe}">Handbuch</a>
                <span>/</span>
                <span th:text="${topic.title}">Thema</span>
            </div>
            <h1 class="page-main-title" th:text="${topic.title}">Thementitel</h1>
        </div>
        <div class="header-actions-cluster seiten-kopf-aktionen">
            <a th:href="@{/hilfe}" class="btn-ui btn-ui-secondary button sekundär" th:text="#{ui.hilfe.zurueck}">Zurück zur Übersicht</a>
        </div>
    </header>

    <article class="card-box detail-bereich hilfe-artikel" style="padding: 2rem; max-width: 820px; line-height: 1.7; font-size: 0.95rem;">
        <div class="markdown-inhalt" th:utext="${topic.html}">
            Vollständiger Hilfetext...
        </div>
    </article>
</main>
</body>
</html>
